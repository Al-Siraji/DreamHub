<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Hub</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background image and rain effects layer -->
    <div class="background"></div>
    <div class="rain-container" id="rain-container"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">Dream Hub</div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <h1 class="quote">"Every man has his own Paradise"</h1>

        <div class="cards-container">
            <!-- Book 1 -->
            <a href="reader.html" class="book-card">
                <div class="book-cover-placeholder">
                    <img src="book1.jpg" alt="Three Days of Happiness" class="book-cover">
                </div>
                <h2 class="book-title">Three Days of Happiness</h2>
                <a>
            </div>
            
            <!-- Book 2 -->
            <div class="book-card">
                <div class="book-cover-placeholder">
                    <img src="book2.jpg" alt="The Girl Who Drank The Moon" class="book-cover">
                </div>
                <h2 class="book-title">The Girl Who Drank The Moon</h2>
            </div>
        </div>

        <button class="explore-btn">Explore More</button>
    </main>

    <!-- Link to external JS file -->
    <script src="script.js"></script>
</body>
</html>
